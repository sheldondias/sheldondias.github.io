<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos | Sheldon Dias Fotografia</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dk8wuuwx/image/upload/v1786150154/icone_uk45xu.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

    <style>

        @font-face {
            font-family: "Aesthetic";
            src: url("fonts/Aesthetic-Regular.woff2") format("woff2"),
                 url("fonts/Aesthetic-Regular.otf") format("opentype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Akira Expanded";
            src: url("fonts/AkiraExpanded-SuperBold.woff2") format("woff2"),
                 url("fonts/AkiraExpanded-SuperBold.otf") format("opentype");
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Montserrat", sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: #0f0f0f;
            color: white;
        }

        img {
            user-select: none;
            -webkit-user-drag: none;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 25px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(15px);
            background: rgba(15, 15, 15, 0.75);
            z-index: 1000;
        }

        nav h1 {
            font-size: 1.3rem;
            letter-spacing: 3px;
        }

        nav h1 a {
            color: white;
            text-decoration: none;
        }

        nav ul {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        nav a {
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        nav a:hover {
            opacity: 0.7;
        }

        nav a.ativo {
            opacity: 1;
            border-bottom: 1px solid white;
            padding-bottom: 4px;
        }

        /* Foto do topo mesclada ao fundo da página: a imagem some
           gradualmente para baixo e para as laterais, sem corte seco. */
        .hero-categoria {
            --foto: url("https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1600");
            position: relative;
            isolation: isolate;
            height: 82vh;
            min-height: 540px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            text-align: center;
            padding: 140px 10% 20px;
        }

        .hero-categoria::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -2;
            background: var(--foto) center 35% / cover no-repeat;
            filter: grayscale(0.25) brightness(0.85);
            -webkit-mask-image:
                linear-gradient(to bottom, #000 0%, #000 30%, rgba(0,0,0,0.55) 62%, transparent 100%),
                linear-gradient(to right, transparent 0%, #000 22%, #000 78%, transparent 100%);
            -webkit-mask-composite: source-in;
            mask-image:
                linear-gradient(to bottom, #000 0%, #000 30%, rgba(0,0,0,0.55) 62%, transparent 100%),
                linear-gradient(to right, transparent 0%, #000 22%, #000 78%, transparent 100%);
            mask-composite: intersect;
            animation: hero-foto 2s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        /* Escurece só o topo, para o menu continuar legível sobre a foto. */
        .hero-categoria::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(15,15,15,0.7) 0%, rgba(15,15,15,0) 28%);
        }

        @keyframes hero-foto {
            from { opacity: 0; transform: scale(1.06); }
            to   { opacity: 1; transform: scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            .hero-categoria::before { animation: none; }
        }

        .hero-categoria span {
            color: #b5b5b5;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .hero-categoria h2 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
        }

        .hero-categoria p {
            font-size: 1.1rem;
            color: #d9d9d9;
            max-width: 600px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.7);
        }

        section {
            padding: 100px 10%;
        }

        #sessoes {
            padding-top: 40px;
        }

        section h2 {
            text-align: center;
            margin-bottom: 50px;
            font-size: 2.5rem;
        }

        .sessoes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr));
            gap: 50px 25px;
        }

        .sessoes-status {
            grid-column: 1 / -1;
            text-align: center;
            color: #888;
            padding: 40px 0;
        }

        .sessao {
            display: block;
            text-decoration: none;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            opacity: 0;
            transform: translateY(30px);
            animation: sessao-entra 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: calc(var(--i, 0) * 90ms);
            transition: transform 0.25s ease;
        }

        @keyframes sessao-entra {
            to { opacity: 1; transform: translateY(0); }
        }

        .sessao .capa-wrap {
            position: relative;
            overflow: hidden;
            aspect-ratio: 4 / 5;
            border-radius: 20px;
            border: 2px solid #2a2a2a;
            background: #0a0a0a;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .sessao .capa-wrap img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            transition: filter 0.6s;
        }

        .sessao .capa-wrap::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0) 45%);
        }

        .sessao-titulo {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: calc(100% - 40px);
            background: #ff6a00;
            color: #000;
            font-weight: 700;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
            transition: background 0.3s;
        }

        .sessao-titulo span {
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .sessao-titulo::after {
            content: "→";
            flex-shrink: 0;
        }

        .sessao-meta {
            margin-top: 14px;
            text-align: center;
            color: #888;
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .sessao:hover {
            transform: translateY(-6px) scale(1.02);
        }

        .sessao:hover .capa-wrap {
            border-color: #ff6a00;
            box-shadow: 0 18px 40px rgba(255, 106, 0, 0.3);
        }

        .sessao:hover .capa-wrap img {
            filter: grayscale(0%);
        }

        .sessao:hover .sessao-titulo {
            background: #fff;
        }

        .sessao:active {
            transform: translateY(-1px) scale(0.98);
        }

        .sessao:focus-visible {
            outline: 3px solid #ff6a00;
            outline-offset: 5px;
        }

        footer {
            text-align: center;
            padding: 40px;
            border-top: 1px solid #222;
            color: #888;
        }

        footer a {
            color: #888;
        }

        @media (max-width: 768px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            .hero-categoria h2 {
                font-size: 2.3rem;
            }

        }

    </style>
</head>

<body>

    <nav>
        <h1><a href="index.html">SHELDON DIAS</a></h1>

        <ul>
            <li><a href="esportes.html">Esportes</a></li>
            <li><a href="eventos.html" class="ativo">Eventos</a></li>
            <li><a href="retratos.html">Retratos</a></li>
        </ul>
    </nav>

    <div class="hero-categoria">
        <span>Trabalhos</span>
        <h2>Eventos</h2>
        <p>Casamentos, formaturas e celebrações. Cada evento reunido em uma sessão — clique para ver todas as fotos daquele dia.</p>
    </div>

    <section id="sessoes">

        <h2>Sessões</h2>

        <div class="sessoes" id="grid-sessoes">
            <p class="sessoes-status">Carregando sessões...</p>
        </div>

    </section>

    <footer>
        © 2026 Sheldon Dias — Todos os direitos reservados. · <a href="index.html">Voltar ao início</a>
    </footer>

    <script src="dados.js"></script>
    <script>

        async function carregarSessoes() {
            const container = document.getElementById("grid-sessoes");

            let todas;
            try {
                todas = await buscarSessoes();
            } catch (erro) {
                container.innerHTML = '<p class="sessoes-status">Não foi possível carregar as sessões. Verifique o link da planilha em dados.js.</p>';
                return;
            }

            const desta = todas.filter(function (s) {
                return s.categoria.toLowerCase() === "eventos" && !s.protegida;
            });

            if (!desta.length) {
                container.innerHTML = '<p class="sessoes-status">Nenhuma sessão de Eventos cadastrada ainda.</p>';
                return;
            }

            container.innerHTML = desta.map(function (s, i) {
                const meta = [s.data, s.local].filter(Boolean).join(" · ");
                return `
                    <a class="sessao" style="--i:${i}" href="galeria.html?sessao=${encodeURIComponent(s.slug)}"${s.cliente ? ` title="${s.cliente}"` : ""}>
                        <div class="capa-wrap">
                            <img src="${s.capa}" alt="">
                            <div class="sessao-titulo"><span>${s.titulo}</span></div>
                        </div>
                        ${meta ? `<div class="sessao-meta">${meta}</div>` : ""}
                    </a>
                `;
            }).join("");

        }

        carregarSessoes();

    </script>

    <script>
        document.addEventListener("contextmenu", function (e) {
            if (e.target.tagName === "IMG") e.preventDefault();
        });
        document.addEventListener("dragstart", function (e) {
            if (e.target.tagName === "IMG") e.preventDefault();
        });
    </script>

</body>
</html>

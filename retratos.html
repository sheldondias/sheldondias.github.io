<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retratos | Sheldon Dias Fotografia</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dk8wuuwx/image/upload/v1786150154/icone_uk45xu.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

    <style>

        @font-face {
            font-family: "Aesthetic";
            src: url("fonts/Aesthetic-Regular.woff2") format("woff2"),
                 url("fonts/Aesthetic-Regular.otf") format("opentype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Akira Expanded";
            src: url("fonts/AkiraExpanded-SuperBold.woff2") format("woff2"),
                 url("fonts/AkiraExpanded-SuperBold.otf") format("opentype");
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Montserrat", sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: #0f0f0f;
            color: white;
        }

        img {
            user-select: none;
            -webkit-user-drag: none;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 25px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(15px);
            background: rgba(15, 15, 15, 0.75);
            z-index: 1000;
        }

        nav h1 {
            font-size: 1.3rem;
            letter-spacing: 3px;
        }

        nav h1 a {
            color: white;
            text-decoration: none;
        }

        nav ul {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        nav a {
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        nav a:hover {
            opacity: 0.7;
        }

        nav a.ativo {
            opacity: 1;
            border-bottom: 1px solid white;
            padding-bottom: 4px;
        }

        .hero-categoria {
            height: 60vh;
            background:
                linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.75)),
                url("https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=1600")
                center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero-categoria span {
            color: #888;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .hero-categoria h2 {
            font-size: 3.5rem;
            margin-bottom: 20px;
        }

        .hero-categoria p {
            font-size: 1.1rem;
            color: #d0d0d0;
            max-width: 600px;
        }

        section {
            padding: 100px 10%;
        }

        section h2 {
            text-align: center;
            margin-bottom: 50px;
            font-size: 2.5rem;
        }

        .sessoes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 60px 25px;
        }

        .sessoes-status {
            grid-column: 1 / -1;
            text-align: center;
            color: #888;
            padding: 40px 0;
        }

        .sessao {
            position: relative;
            overflow: hidden;
            border-radius: 28px;
            cursor: pointer;
            display: block;
            color: white;
            text-decoration: none;
            background: #131313;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 48px -22px rgba(0, 0, 0, 0.65);
            opacity: 0;
            transform: translateY(30px);
            animation: sessao-entra 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: calc(var(--i, 0) * 90ms);
            transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.55s ease,
                        border-color 0.55s ease;
        }

        @keyframes sessao-entra {
            to { opacity: 1; transform: translateY(0); }
        }

        .sessao:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.24);
            box-shadow: 0 32px 60px -18px rgba(0, 0, 0, 0.8);
        }

        .sessao .capa-wrap {
            position: relative;
            width: 100%;
            height: 480px;
            overflow: hidden;
            background: #0a0a0a;
        }

        .sessao img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform: scale(1.04);
            filter: brightness(0.86) saturate(1.05);
            transition: transform 1.1s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 0.6s ease;
        }

        .sessao:hover img {
            transform: scale(1.13);
            filter: brightness(0.6) saturate(1.1);
        }

        .sessao::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            background: linear-gradient(to top,
                rgba(0, 0, 0, 0.92) 0%,
                rgba(0, 0, 0, 0.5) 40%,
                rgba(0, 0, 0, 0.05) 66%,
                rgba(0, 0, 0, 0.25) 100%);
            pointer-events: none;
        }

        .sessao-cliente {
            position: absolute;
            top: 22px;
            left: 22px;
            z-index: 2;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 999px;
            background: rgba(15, 15, 15, 0.4);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #f2f2f2;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.45s ease, transform 0.45s ease;
        }

        .sessao-cliente svg {
            width: 11px;
            height: 11px;
            flex-shrink: 0;
        }

        .sessao:hover .sessao-cliente {
            opacity: 1;
            transform: translateY(0);
        }

        .sessao-info {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            text-align: left;
            padding: 40px 36px 32px;
        }

        .sessao-info h3 {
            font-family: "Aesthetic", "Playfair Display", serif;
            font-weight: 400;
            font-size: clamp(2.4rem, 5vw, 3.6rem);
            line-height: 0.95;
            text-transform: uppercase;
            margin-bottom: 20px;
            width: 100%;
            text-shadow: 0 4px 26px rgba(0, 0, 0, 0.6);
            transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sessao:hover .sessao-info h3 {
            transform: translateY(-4px);
        }

        .sessao-meta {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            font-family: "Akira Expanded", "Arial Narrow", sans-serif;
            font-weight: 800;
            font-size: 0.82rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #e4e4e4;
        }

        .sessao-meta span {
            flex-shrink: 0;
        }

        .sessao-meta .linha {
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0));
        }

        .sessao-seta {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.32);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateX(-10px) rotate(-45deg);
            transition: opacity 0.45s ease,
                        transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                        background 0.35s ease,
                        border-color 0.35s ease;
        }

        .sessao-seta svg {
            width: 13px;
            height: 13px;
        }

        .sessao:hover .sessao-seta {
            opacity: 1;
            transform: translateX(0) rotate(0deg);
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.65);
        }

        footer {
            text-align: center;
            padding: 40px;
            border-top: 1px solid #222;
            color: #888;
        }

        footer a {
            color: #888;
        }

        @media (max-width: 768px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            .hero-categoria h2 {
                font-size: 2.3rem;
            }

            .sessao .capa-wrap {
                height: 320px;
            }

        }

    </style>
</head>

<body>

    <nav>
        <h1><a href="index.html">SHELDON DIAS</a></h1>

        <ul>
            <li><a href="esportes.html">Esportes</a></li>
            <li><a href="eventos.html">Eventos</a></li>
            <li><a href="retratos.html" class="ativo">Retratos</a></li>
        </ul>
    </nav>

    <div class="hero-categoria">
        <span>Trabalhos</span>
        <h2>Retratos</h2>
        <p>Ensaios individuais e editoriais. Cada pessoa reunida em uma sessão — clique para ver todas as fotos do seu ensaio.</p>
    </div>

    <section id="sessoes">

        <h2>Sessões</h2>

        <div class="sessoes" id="grid-sessoes">
            <p class="sessoes-status">Carregando sessões...</p>
        </div>

    </section>

    <footer>
        © 2026 Sheldon Dias — Todos os direitos reservados. · <a href="index.html">Voltar ao início</a>
    </footer>

    <script src="dados.js"></script>
    <script>

        async function carregarSessoes() {
            const container = document.getElementById("grid-sessoes");

            let todas;
            try {
                todas = await buscarSessoes();
            } catch (erro) {
                container.innerHTML = '<p class="sessoes-status">Não foi possível carregar as sessões. Verifique o link da planilha em dados.js.</p>';
                return;
            }

            const desta = todas.filter(function (s) {
                return s.categoria.toLowerCase() === "retratos" && !s.protegida;
            });

            if (!desta.length) {
                container.innerHTML = '<p class="sessoes-status">Nenhuma sessão de Retratos cadastrada ainda.</p>';
                return;
            }

            container.innerHTML = desta.map(function (s, i) {
                return `
                    <a class="sessao" style="--i:${i}" href="galeria.html?sessao=${encodeURIComponent(s.slug)}">
                        <div class="capa-wrap">
                            <img src="${s.capa}" alt="">
                        </div>
                        ${s.cliente ? `
                        <div class="sessao-cliente">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg>
                            ${s.cliente}
                        </div>` : ""}
                        <div class="sessao-info">
                            <h3>${s.titulo}</h3>
                            <div class="sessao-meta">
                                <span>${s.data}</span>
                                <span class="linha"></span>
                                <span>${s.local}</span>
                                <span class="sessao-seta">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"></path><path d="M7 7h10v10"></path></svg>
                                </span>
                            </div>
                        </div>
                    </a>
                `;
            }).join("");

        }

        carregarSessoes();

    </script>

    <script>
        document.addEventListener("contextmenu", function (e) {
            if (e.target.tagName === "IMG") e.preventDefault();
        });
        document.addEventListener("dragstart", function (e) {
            if (e.target.tagName === "IMG") e.preventDefault();
        });
    </script>

</body>
</html>
